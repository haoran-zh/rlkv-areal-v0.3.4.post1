experiment_name: learned-loki-grpo
trial_name: trial0
seed: 1
total_train_epochs: 2
tokenizer_path: ${actor.path}
async_training: true

cluster:
  n_nodes: 1
  n_gpus_per_node: 4
  fileroot: expr/experiments
  name_resolve:
    type: nfs
    nfs_record_root: expr/name_resolve

allocation_mode: sglang:d1+fsdp:d1

rollout:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 64
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: false

gconfig:
  n_samples: 4
  min_new_tokens: 0
  max_new_tokens: 7168
  greedy: false
  temperature: 1.0

actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: false
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 7680
  optimizer:
    type: adam
    lr: 1.0e-2
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
  backend: fsdp
  group_size: ${gconfig.n_samples}
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  behav_imp_weight_cap: 5.0
  dynamic_sampling: false
  adv_norm:
    mean_level: batch
    std_level: batch
  max_new_tokens: ${gconfig.max_new_tokens}
  enable_mixed_attn_training: false
  enable_semantic_kv_training: false
  enable_learned_loki_training: true
  learned_loki_rank: 32
  learned_loki_budget_ratio: 0.5
  learned_loki_sink_window_size: 16
  learned_loki_recent_window_size: 64
  learned_loki_threshold_init: 0.0
  learned_loki_init_mode: orthogonal
  learned_loki_init_path: null
  learned_loki_gate_temperature_init: 1.0
  learned_loki_gate_temperature_final: 1.0
  learned_loki_gate_temperature_anneal_steps: 0
  learned_loki_sparse_loss_scale: 0.1
  learned_loki_reward_scaled_sparse_loss: false

ref:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 7680
  optimizer: null
  backend: fsdp

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  attention_backend: torch_native
  max_running_requests: 128
  context_length: 7680
  mem_fraction_static: 0.7
  enable_learned_loki: true
  disable_radix_cache: true
  disable_overlap_schedule: true
  learned_loki_rank: ${actor.learned_loki_rank}
  learned_loki_budget_ratio: ${actor.learned_loki_budget_ratio}
  learned_loki_sink_window_size: ${actor.learned_loki_sink_window_size}
  learned_loki_recent_window_size: ${actor.learned_loki_recent_window_size}
  learned_loki_gate_temperature: ${actor.learned_loki_gate_temperature_init}
  learned_loki_threshold_init: ${actor.learned_loki_threshold_init}

train_dataset:
  batch_size: 32
  shuffle: true
  pin_memory: true
  num_workers: 4
  path: Kurt232/Sampled-Laser-Dataset-V4
  type: rl
  max_length: 1024

valid_dataset:
  batch_size: 32
  shuffle: true
  pin_memory: true
  num_workers: 4
  path: Kurt232/Sampled-Laser-Dataset-V4
  type: rl

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 10
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 10
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

launcher:
  inference_server_cpus_per_gpu: 4
  inference_server_mem_per_gpu: 32768
  trainer_cpus_per_gpu: 4
  trainer_mem_per_gpu: 32768
